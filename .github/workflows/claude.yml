name: Claude

# PR/이슈 댓글이나 리뷰에 @claude 를 적으면 실행된다.
# 예: "@claude 이 PR 다시 리뷰해줘", "@claude 이 메서드 동시성 문제 없어?"
# 구독 사용량을 아끼기 위해 레포 멤버/협업자가 호출한 경우에만 실행한다.
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: |
      (
        (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude'))
      ) && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'),
        github.event.comment.author_association || github.event.review.author_association)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read # PR의 CI 결과를 읽기 위해 필요
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Run Claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: |
            --append-system-prompt "모든 답변과 코멘트는 한국어로 작성한다. 이 레포는 Java 21 / Spring Boot 기반 MSA다."
