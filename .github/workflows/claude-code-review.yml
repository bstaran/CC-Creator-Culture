name: Claude Code Review

# PR이 열리거나 Ready for review로 바뀔 때 한 번 자동 리뷰한다.
# 커밋 push마다 다시 돌리면 구독 사용량이 빨리 소진되므로 synchronize는 넣지 않았다.
# 추가 커밋 후 재리뷰가 필요하면 PR 댓글에 @claude 로 요청한다 (claude.yml).
on:
  pull_request:
    types: [opened, ready_for_review, reopened]
    branches: [main, dev]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Run Claude review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          track_progress: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            이 PR을 리뷰해줘. 모든 코멘트는 한국어로 작성한다.

            프로젝트 배경: Java 21 / Spring Boot 기반 MSA (gateway, eureka, config-server,
            user/order/product 서비스, Kafka, PostgreSQL). 공통 코드는 libs/common 에 있다.

            중점적으로 볼 것:
            1. 버그와 정합성: 잘못된 로직, 누락된 예외 처리, 트랜잭션 경계, 동시성 문제
            2. 서비스 간 통신: 내부 API 인증, Kafka 메시지 처리(중복/순서/재시도), 게이트웨이 라우팅
            3. 보안: 입력 검증, 인증/인가 누락, 민감 정보 노출
            4. 성능: N+1 쿼리, 불필요한 조회, 인덱스가 필요한 쿼리
            5. 테스트: 변경된 동작에 대한 테스트 누락

            규칙:
            - 확실한 문제만 지적하고, 단순 취향 차이나 사소한 스타일 지적은 하지 않는다.
            - 특정 코드 줄의 문제는 인라인 코멘트로, 전체 요약은 PR 최상단 코멘트 하나로 남긴다.
            - 각 지적에는 왜 문제인지와 어떻게 고치면 되는지를 함께 적는다.
            - 문제가 없으면 짧게 "특이사항 없음"이라고 요약한다.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
